<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 مزرعتي - لعبة المزرعة العربية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== الشاشة الرئيسية ==================== -->
    <div id="mainMenu">
        <h1>🌾 مزرعتي</h1>
        <h2>🐓 🐄 🐑</h2>
        <button onclick="startGame()">▶️ ابدأ اللعب</button>
        <button onclick="showShop()">🛒 المتجر</button>
        <button onclick="showLevels()">📋 المراحل</button>
        <button onclick="showSettings()">⚙️ الإعدادات</button>
    </div>

    <!-- ==================== شاشة اللعب ==================== -->
    <div id="gameScreen" style="display:none;">
        <!-- رأس اللعبة -->
        <div id="gameHeader">
            <span>⭐ المرحلة: <span id="levelNumber">1</span></span>
            <span>🪙 <span id="goldCoins">0</span></span>
            <span>🔘 <span id="silverCoins">0</span></span>
            <span>⏱️ <span id="timer">120</span> ثانية</span>
        </div>

        <!-- منطقة المزرعة -->
        <div id="farmArea">
            <div id="animalsContainer">
                <div class="animal" data-type="chicken">🐔</div>
                <div class="animal" data-type="cow">🐄</div>
                <div class="animal" data-type="sheep">🐑</div>
                <div class="animal" data-type="horse">🐴</div>
            </div>
            <div id="cropsContainer">
                <div class="crop" data-type="wheat">🌾 قمح</div>
                <div class="crop" data-type="carrot">🥕 جزر</div>
                <div class="crop" data-type="tomato">🍅 طماطم</div>
            </div>
        </div>

        <!-- المهام -->
        <div id="tasksContainer">
            <h3>📋 المهام:</h3>
            <ul id="tasksList"></ul>
        </div>

        <!-- أزرار التحكم -->
        <div id="gameControls">
            <button onclick="endLevel()" id="endLevelBtn">⏹️ إنهاء المرحلة</button>
            <button onclick="resetLevel()" id="resetLevelBtn">🔄 إعادة المحاولة</button>
        </div>
    </div>

    <!-- ==================== شاشة النتائج ==================== -->
    <div id="resultScreen" style="display:none;">
        <h1>🎉 انتهت المرحلة!</h1>
        <div id="resultStarsContainer">
            <span id="resultStars">⭐⭐⭐</span>
        </div>
        <div id="resultRewards">
            <p>🪙 <span id="resultGold">0</span> ذهبية</p>
            <p>🔘 <span id="resultSilver">0</span> فضية</p>
        </div>
        <div id="resultButtons">
            <button onclick="nextLevel()">▶️ المرحلة التالية</button>
            <button onclick="backToMenu()">🏠 القائمة الرئيسية</button>
        </div>
    </div>

    <!-- ==================== شاشة المتجر ==================== -->
    <div id="shopScreen" style="display:none;">
        <h1>🛒 المتجر</h1>
        <div id="shopItems">
            <div class="shop-item">
                <span>🐔 دجاجة جديدة</span>
                <span>50 🪙</span>
                <button onclick="buyItem('chicken', 50)">شراء</button>
            </div>
            <div class="shop-item">
                <span>🐄 بقرة جديدة</span>
                <span>150 🪙</span>
                <button onclick="buyItem('cow', 150)">شراء</button>
            </div>
            <div class="shop-item">
                <span>🌾 بذور قمح (×10)</span>
                <span>20 🔘</span>
                <button onclick="buyItem('wheat_seeds', 20)">شراء</button>
            </div>
            <div class="shop-item">
                <span>⚡ طاقة سريعة</span>
                <span>10 🔘</span>
                <button onclick="buyItem('energy', 10)">شراء</button>
            </div>
        </div>
        <button onclick="backToMenu()" id="shopBackBtn">🏠 العودة</button>
    </div>

    <!-- ==================== شاشة الإعدادات ==================== -->
    <div id="settingsScreen" style="display:none;">
        <h1>⚙️ الإعدادات</h1>
        <div id="settingsContent">
            <label>
                <input type="checkbox" id="soundToggle" checked> 🔊 المؤثرات الصوتية
            </label>
            <label>
                <input type="checkbox" id="musicToggle" checked> 🎵 الموسيقى الخلفية
            </label>
            <label>
                <input type="checkbox" id="vibrationToggle" checked> 📳 الاهتزاز
            </label>
            <button onclick="resetProgress()" id="resetProgressBtn">🗑️ حذف التقدم</button>
        </div>
        <button onclick="backToMenu()" id="settingsBackBtn">🏠 العودة</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
